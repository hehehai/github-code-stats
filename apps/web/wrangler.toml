name = "github-code-stats"
main = "@tanstack/react-start/server-entry"
compatibility_date = "2025-07-18"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[[r2_buckets]]
binding = "CACHE_BUCKET"
bucket_name = "github-code-stats"
preview_bucket_name = "github-code-stats"

# CORS_ORIGIN
# GITHUB_TOKEN should be set via:
# - .dev.vars file for local development
# - wrangler secret put GITHUB_TOKEN for production
